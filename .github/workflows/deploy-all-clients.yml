name: Deploy — Tous les clients

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-all-clients
  cancel-in-progress: false

jobs:
  targets:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      workers: ${{ steps.targets.outputs.workers }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Read explicit client targets
        id: targets
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs'
          const workers = readFileSync('scripts/clients.txt', 'utf8').split(/\r?\n/).map(value => value.trim()).filter(value => value && !value.startsWith('#'))
          if (!workers.length || workers.some(value => !/^[a-z0-9][a-z0-9-]{1,62}$/.test(value) || value === 'orsayn-cockpit')) throw new Error('Invalid or empty client target list')
          appendFileSync(process.env.GITHUB_OUTPUT, `workers=${JSON.stringify(workers)}\n`)
          NODE

  deploy:
    needs: targets
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        worker: ${{ fromJSON(needs.targets.outputs.workers) }}
    uses: ./.github/workflows/deploy-client.yml
    with:
      worker_name: ${{ matrix.worker }}
    secrets: inherit
